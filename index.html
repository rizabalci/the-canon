<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Canon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap');

:root{
  --ink:#15130f;
  --panel:#1d1a14;
  --panel2:#241f18;
  --ivory:#ece4d4;
  --ivory-dim:#b9ae98;
  --brass:#8c7851;
  --brass-dim:#4a4133;
  --amber:#e8a33d;
  --amber-dim:#6b5426;
  --burgundy:#7a3b3b;
  --sage:#5f7a5c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--ink); color:var(--ivory); font-family:'Source Serif 4', Georgia, serif;}
body{padding-bottom:40px;}

.marquee{
  position:sticky; top:0; z-index:20;
  background:var(--ink);
  border-bottom:1px solid var(--brass-dim);
  padding:18px 16px 12px;
}
.marquee::after{
  content:"";
  display:block;
  height:6px;
  margin-top:12px;
  background-image: radial-gradient(circle, var(--ink) 2.5px, var(--brass-dim) 3px, transparent 3.4px);
  background-size: 16px 16px;
  background-position: 0 -5px;
}
h1{
  font-family:'Bebas Neue', sans-serif;
  letter-spacing:2px;
  font-size:34px;
  margin:0;
  color:var(--amber);
  line-height:1;
}
.sub{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ivory-dim);
  margin-top:4px;
  letter-spacing:0.5px;
}

.progress-row{
  display:flex; align-items:center; gap:10px;
  margin-top:14px;
}
.progress-track{
  flex:1; height:6px; border-radius:3px;
  background:var(--panel2);
  overflow:hidden;
  border:1px solid var(--brass-dim);
}
.progress-fill{
  height:100%; background:var(--amber);
  transition:width .35s ease;
}
.progress-count{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px; color:var(--amber);
  white-space:nowrap;
}

.controls{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.search-wrap{ position:relative; }
#search{
  width:100%; padding:10px 12px; font-size:14px;
  background:var(--panel); border:1px solid var(--brass-dim);
  border-radius:6px; color:var(--ivory);
  font-family:'Source Serif 4', serif;
}
#search::placeholder{ color:var(--ivory-dim); }
#search:focus{ outline:none; border-color:var(--amber); }

.chip-row{
  display:flex; gap:6px; overflow-x:auto; padding-bottom:4px;
  scrollbar-width:none;
}
.chip-row::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; letter-spacing:0.3px;
  padding:6px 11px; border-radius:20px;
  border:1px solid var(--brass-dim);
  background:transparent; color:var(--ivory-dim);
  cursor:pointer; white-space:nowrap;
}
.chip.active{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); }

.status-row{ display:flex; gap:6px; }
.status-btn{
  flex:1; font-family:'IBM Plex Mono', monospace; font-size:11px;
  padding:7px 8px; border-radius:6px;
  border:1px solid var(--brass-dim); background:transparent; color:var(--ivory-dim);
  cursor:pointer;
}
.status-btn.active{ background:var(--panel2); border-color:var(--amber); color:var(--amber); }

.sort-select{
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  background:var(--panel); color:var(--ivory-dim);
  border:1px solid var(--brass-dim); border-radius:6px; padding:7px 8px;
}

.list{ padding:14px 12px 0; display:flex; flex-direction:column; gap:10px; }
.empty{
  text-align:center; color:var(--ivory-dim); font-family:'IBM Plex Mono', monospace;
  font-size:12px; padding:40px 20px;
}

.card{
  display:flex;
  background:var(--panel);
  border:1px solid var(--brass-dim);
  border-radius:8px;
  overflow:hidden;
  transition:border-color .2s ease;
}
.card.watched{ border-color:var(--amber-dim); }

.card-main{ flex:1; padding:12px 12px; min-width:0; cursor:pointer; }
.card-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.card-title{ font-size:16px; font-weight:600; color:var(--ivory); line-height:1.25; }
.card-year{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--brass); flex:0 0 auto; }
.card-genres{ margin-top:4px; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--sage); letter-spacing:0.3px; }
.card-director{ margin-top:2px; font-size:12px; color:var(--ivory-dim); font-style:italic; }

.card-detail{ display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--brass-dim); }
.card-detail.open{ display:block; }
.card-desc{ font-size:13.5px; color:var(--ivory); line-height:1.5; }
.card-cast{ margin-top:8px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ivory-dim); line-height:1.6; }
.card-cast b{ color:var(--brass); font-weight:500; }
.cast-name{ cursor:pointer; text-decoration:underline; text-decoration-color:var(--brass-dim); text-underline-offset:2px; }
.cast-name:hover{ color:var(--amber); }

.stub{
  flex:0 0 56px;
  border-left:2px dashed var(--brass-dim);
  position:relative;
  display:flex; align-items:center; justify-content:center;
  background:var(--panel2);
}
.stub::before, .stub::after{
  content:""; position:absolute; left:-7px; width:14px; height:14px;
  border-radius:50%; background:var(--ink);
}
.stub::before{ top:-7px; }
.stub::after{ bottom:-7px; }

.punch{
  width:30px; height:30px; border-radius:50%;
  border:2px solid var(--brass);
  background:transparent;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono', monospace; font-size:14px;
  color:transparent;
  transition:all .15s ease;
}
.punch.on{
  background:var(--amber); border-color:var(--amber); color:var(--ink);
}
.rank{
  position:absolute; bottom:6px; left:0; right:0; text-align:center;
  font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--brass-dim);
}

.footnote{
  margin:24px 16px 0; font-family:'IBM Plex Mono', monospace; font-size:10.5px;
  color:var(--ivory-dim); line-height:1.6; opacity:0.7;
}
</style>
</head>

{t:"Touch of Evil",y:1958,d:"Orson Welles",g:["Crime","Drama","Film-Noir"],c:["Charlton Heston","Janet Leigh","Orson Welles"],x:"A corrupt border-town police captain frames a suspect while a Mexican narcotics officer investigates."}

const GENRES = [...new Set(MOVIES.flatMap(m => m.g))].sort();
const slug = m => (m.t + '-' + m.y).toLowerCase().replace(/[^a-z0-9]+/g,'-');

let watched = new Set();
let state = { q:'', genre:'All', status:'all', sort:'rank' };

async function loadWatched(){
  try{
    const r = await window.storage.get('canon-watched-v1');
    if(r && r.value) watched = new Set(JSON.parse(r.value));
  }catch(e){ /* no saved state yet */ }
  render();
}
async function saveWatched(){
  try{ await window.storage.set('canon-watched-v1', JSON.stringify([...watched]), false); }
  catch(e){ console.error('Save failed', e); }
}

function toggleWatched(id){
  if(watched.has(id)) watched.delete(id); else watched.add(id);
  saveWatched();
  render();
}

function buildGenreChips(){
  const row = document.getElementById('genreRow');
  const chips = ['All', ...GENRES];
  row.innerHTML = chips.map(g =>
    `<button class="chip${state.genre===g?' active':''}" data-genre="${g}">${g}</button>`
  ).join('');
  row.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.genre = btn.dataset.genre; buildGenreChips(); render(); });
  });
}

function matches(m){
  const id = slug(m);
  if(state.status==='watched' && !watched.has(id)) return false;
  if(state.status==='unwatched' && watched.has(id)) return false;
  if(state.genre!=='All' && !m.g.includes(state.genre)) return false;
  if(state.q){
    const q = state.q.toLowerCase();
    const hay = (m.t + ' ' + m.c.join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function sortList(list){
  if(state.sort==='az') return [...list].sort((a,b)=>a.t.localeCompare(b.t));
  if(state.sort==='year') return [...list].sort((a,b)=>a.y-b.y);
  return list;
}

function render(){
  const total = MOVIES.length;
  document.getElementById('subCount').textContent = total + ' essential films \u00b7 a personal watchlist';
  const watchedCount = MOVIES.filter(m=>watched.has(slug(m))).length;
  document.getElementById('progressFill').style.width = (watchedCount/total*100)+'%';
  document.getElementById('progressCount').textContent = watchedCount + ' / ' + total;

  const filtered = sortList(MOVIES.filter(matches));
  const list = document.getElementById('list');

  if(filtered.length===0){
    list.innerHTML = '<div class="empty">No films match those filters.</div>';
    return;
  }

  list.innerHTML = filtered.map((m,i)=>{
    const id = slug(m);
    const isWatched = watched.has(id);
    const rank = MOVIES.indexOf(m)+1;
    return `
    <div class="card${isWatched?' watched':''}" data-id="${id}">
      <div class="card-main" data-toggle-detail="${id}">
        <div class="card-top">
          <div class="card-title">${m.t}</div>
          <div class="card-year">${m.y}</div>
        </div>
        <div class="card-director">${m.d}</div>
        <div class="card-genres">${m.g.join(' \u00b7 ')}</div>
        <div class="card-detail" id="detail-${id}">
          <div class="card-desc">${m.x}</div>
          <div class="card-cast"><b>Cast:</b> ${m.c.map(name=>`<span class="cast-name" data-actor="${name}">${name}</span>`).join(', ')}</div>
        </div>
      </div>
      <div class="stub" data-toggle-watch="${id}">
        <div class="punch${isWatched?' on':''}">&#10003;</div>
        <div class="rank">#${rank}</div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('[data-toggle-watch]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); toggleWatched(el.dataset.toggleWatch); });
  });
  list.querySelectorAll('[data-toggle-detail]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.toggleDetail;
      document.getElementById('detail-'+id).classList.toggle('open');
    });
  });
  list.querySelectorAll('.cast-name').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      document.getElementById('search').value = el.dataset.actor;
      state.q = el.dataset.actor;
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

document.getElementById('search').addEventListener('input', e=>{ state.q = e.target.value; render(); });
document.querySelectorAll('.status-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.status-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.status = btn.dataset.status;
    render();
  });
});
document.getElementById('sortSelect').addEventListener('change', e=>{ state.sort = e.target.value; render(); });

buildGenreChips();
loadWatched();
</script>
